name: Publish to Google Play

# Started by hand (Actions tab or API): builds the signed release bundle
# (AAB) and uploads it to a Google Play testing track, where the testers
# of that track get the update from the Play Store.
#
# Google Play only accepts uploads through the API once the app exists in
# the Play Console and its first bundle was uploaded there by hand: run
# this with "upload" off and upload the AAB from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Testing track
        type: choice
        options: [internal, alpha, beta]
        default: internal
      status:
        description: "completed: testers get it right away; draft: needed while the app is still a draft in the Play Console"
        type: choice
        options: [completed, draft]
        default: completed
      upload:
        description: Upload to Google Play (off only builds the AAB)
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The upload key comes from the repository secrets and only exists on
      # the runner while the job runs.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release bundle
        run: ./gradlew bundleRelease

      # What's New in the Play Store, from release-notes.txt (Croatian,
      # at most 500 characters).
      - name: Release notes
        run: |
          mkdir -p whatsnew
          head -c 500 release-notes.txt > whatsnew/whatsnew-hr-HR

      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: software.rdd.apexperformance
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: whatsnew

      # For the first upload by hand. The repository is public, so the
      # bundle is kept only for a day.
      - name: Keep the bundle
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Remove the signing key
        if: always()
        run: rm -f upload-keystore.jks keystore.properties
