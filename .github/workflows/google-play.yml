name: Publish to Google Play

# Started by hand (Actions tab or API): builds the signed release bundle
# (AAB) and releases it to Google Play testing tracks: internal testing and
# closed testing (the "alpha" track) by default, so the testers of both get
# the update from the Play Store.
#
# Google Play only accepts uploads through the API once the app exists in
# the Play Console and its first bundle was uploaded there by hand: run
# this with "upload" off and upload the AAB from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Testing tracks: internal testing, closed testing (alpha) or both; \"closed, version already uploaded\" releases the current versionCode, already on internal testing, to closed testing without a new upload"
        type: choice
        options: [internal and closed, internal, closed, "closed, version already uploaded"]
        default: internal and closed
      status:
        description: "completed: testers get it right away; draft: needed while the app is still a draft in the Play Console"
        type: choice
        options: [completed, draft]
        default: completed
      upload:
        description: Upload to Google Play (off only builds the AAB)
        type: boolean
        default: true

# Google Play access without a stored key (Workload Identity Federation):
# GitHub's token for this run is exchanged for a short-lived token of the
# github-play-upload service account. Only this repository may do that.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The upload key comes from the repository secrets and only exists on
      # the runner while the job runs.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release bundle
        run: ./gradlew bundleRelease

      # What's New in the Play Store, from release-notes.txt (Croatian,
      # at most 500 characters).
      - name: Release notes
        run: |
          mkdir -p whatsnew
          # By characters, so a letter like č is never cut in half.
          python3 -c "import sys; sys.stdout.write(open('release-notes.txt', encoding='utf-8').read()[:500])" > whatsnew/whatsnew-hr-HR

      - name: Sign in to Google Cloud
        id: google
        if: ${{ inputs.upload }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
          # Also a short-lived token for the Play API call below.
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play
        if: ${{ inputs.upload && inputs.tracks != 'closed, version already uploaded' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: ${{ steps.google.outputs.credentials_file_path }}
          packageName: software.rdd.apexperformance
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          # The bundle is uploaded once, to the first track; the second
          # track gets the same version in the next step.
          track: ${{ inputs.tracks == 'closed' && 'alpha' || 'internal' }}
          status: ${{ inputs.status }}
          whatsNewDirectory: whatsnew

      # Google Play takes a bundle only once, so closed testing gets the
      # version that was just uploaded to internal testing.
      - name: Release to closed testing too
        if: ${{ inputs.upload && (inputs.tracks == 'internal and closed' || inputs.tracks == 'closed, version already uploaded') }}
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/software.rdd.apexperformance
          version_code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          body=$(python3 -c "import json, os; print(json.dumps({'track': 'alpha', 'releases': [{'versionCodes': ['$version_code'], 'status': os.environ['STATUS'], 'releaseNotes': [{'language': 'hr-HR', 'text': open('whatsnew/whatsnew-hr-HR', encoding='utf-8').read()}]}]}))")
          auth="Authorization: Bearer $TOKEN"
          edit=$(curl -sS --fail-with-body -X POST -H "$auth" "$api/edits" | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          curl -sS --fail-with-body -X PUT -H "$auth" -H "Content-Type: application/json" \
            "$api/edits/$edit/tracks/alpha" -d "$body" > /dev/null
          curl -sS --fail-with-body -X POST -H "$auth" "$api/edits/$edit:commit" > /dev/null
          echo "Version code $version_code released to closed testing (alpha)"

      # For the first upload by hand. The repository is public, so the
      # bundle is kept only for a day.
      - name: Keep the bundle
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Remove the signing key
        if: always()
        run: rm -f upload-keystore.jks keystore.properties
